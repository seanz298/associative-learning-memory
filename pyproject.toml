[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "associative-learning-memory"
version = "0.1.0"
description = "Connect new papers and notes to the problems you set aside."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
alm = "alm.cli:main"

[tool.setuptools]
packages = ["alm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
